[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imf-ptq"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "torch", "transformers", "datasets", "accelerate", "sentencepiece"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

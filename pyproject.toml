[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imf-tier0-ptq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "hypothesis>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU",
  "model_download: downloads model or dataset artifacts",
  "slow: long-running integration test",
]
